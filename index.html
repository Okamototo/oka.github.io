<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sora Clock</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sora Clock">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* レイアウト：横向き1画面。左に大きな時計と3日予報、右に現在の天気カードと時間ごとの予報 */
:root {
  --bg: #000000;
  --fg: #ffffff;
  --fg-2: rgba(255, 255, 255, 0.78);
  --fg-3: rgba(255, 255, 255, 0.55);
  --card: rgba(8, 18, 44, 0.20);
  --card-line: rgba(255, 255, 255, 0.16);
  --shadow: 0 1px 14px rgba(0, 10, 40, 0.22);
  --sun: #ffd60a;
  --rain: #64d2ff;
  --snow: #e5f4ff;
  --bolt: #ffd60a;
  --cloud: #e9eef7;
  --font-num: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", -apple-system, system-ui, sans-serif;
  --font-ui: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
/* ---- 背景：空のグラデーション（2枚を重ねてフェード）＋ 雲・雨・雪・星を描くキャンバス ---- */
.sky { position: fixed; inset: 0; pointer-events: none; }
.sky-grad { position: absolute; inset: 0; transition: opacity 3s ease; }
#skyB { opacity: 0; }
#fx { position: absolute; inset: 0; width: 100%; height: 100%; }
/* 時計の周りだけ、わずかに暗くして文字を読みやすくする */
.scrim {
  position: absolute; inset: 0;
  background: radial-gradient(60% 70% at 28% 50%, rgba(0, 12, 40, var(--scrim, 0.12)), transparent 75%);
  transition: opacity 3s ease;
}
.sky { transition: opacity 1.5s ease; }
body.night .sky { opacity: 0.75; }
.app {
  position: relative;
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
  gap: 3.2vw;
  padding:
    max(4vh, env(safe-area-inset-top, 0px))
    max(4vw, env(safe-area-inset-right, 0px))
    max(4vh, env(safe-area-inset-bottom, 0px))
    max(4vw, env(safe-area-inset-left, 0px));
  transition: opacity 1.5s ease, filter 1.5s ease;
}
body.night .app { opacity: 0.55; filter: saturate(0.6); }
.app { text-shadow: var(--shadow); }

/* ---- 左：時計 ---- */
.clock {
  display: flex; flex-direction: column; justify-content: center;
  min-width: 0;
}
.date {
  font-size: clamp(14px, 5.4vh, 30px);
  font-weight: 600;
  color: var(--fg-2);
  letter-spacing: 0.02em;
  padding-left: 0.3em;
}
.date .wd { color: #ff453a; margin-left: 0.4em; }
.date .wd.sat { color: #64d2ff; }
.date .wd.week { color: var(--fg-2); }
.time {
  display: flex; align-items: baseline;
  font-family: var(--font-num);
  font-weight: 600;
  font-size: min(16.5vw, 40vh);
  line-height: 0.95;
  letter-spacing: -0.035em;
  font-variant-numeric: tabular-nums;
  margin: 0.5vh 0 0;
  white-space: nowrap;
}
.time .colon {
  display: inline-block;
  margin: 0 0.02em;
  transform: translateY(-0.06em);
  color: var(--fg-2);
  transition: opacity 0.35s ease;
}
.time .colon.dim { opacity: 0.25; }
.time .sec {
  font-size: 0.24em;
  color: var(--fg-3);
  margin-left: 0.25em;
  letter-spacing: 0;
}
.days {
  display: flex; flex-wrap: wrap; gap: 1.2vh 1.8vw;
  margin-top: 4.5vh;
  padding-left: 0.4em;
}
.day {
  display: flex; align-items: center; gap: 0.4em;
  font-size: clamp(11px, 3.9vh, 20px);
  color: var(--fg-2);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.day .name { font-weight: 600; color: var(--fg); }
.day svg { width: 1.6em; height: 1.6em; flex: none; }
.day .hi { color: var(--fg); font-weight: 600; font-family: var(--font-num); }
.day .lo { font-family: var(--font-num); color: var(--fg-3); }

/* ---- 右：天気カード ---- */
.weather {
  align-self: center;
  min-width: 0;
  background: var(--card);
  border: 1px solid var(--card-line);
  border-radius: 28px;
  padding: 3.6vh 2.4vw;
  -webkit-backdrop-filter: blur(24px) saturate(1.3);
  backdrop-filter: blur(24px) saturate(1.3);
  text-shadow: none;
  display: flex; flex-direction: column; gap: 2.4vh;
}
.place {
  display: flex; align-items: center; gap: 0.35em;
  font-size: clamp(12px, 3.9vh, 18px);
  font-weight: 600;
  color: var(--fg-2);
}
.place svg { width: 0.95em; height: 0.95em; fill: currentColor; }
.now { display: flex; align-items: center; justify-content: space-between; gap: 1vw; }
.now .temp {
  font-family: var(--font-num);
  font-size: min(9.5vw, 21vh);
  font-weight: 500;
  line-height: 1;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}
.now .icon svg { width: min(10vw, 22vh); height: min(10vw, 22vh); display: block; }
.cond { display: flex; flex-direction: column; gap: 0.3vh; }
.cond .label { font-size: clamp(13px, 4.6vh, 22px); font-weight: 600; }
.cond .meta {
  display: flex; flex-wrap: wrap; gap: 0 0.9em;
  font-size: clamp(11px, 3.5vh, 16px);
  color: var(--fg-2);
  font-variant-numeric: tabular-nums;
}
.hours {
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  border-top: 1px solid var(--card-line);
  padding-top: 2.2vh;
  text-align: center;
}
.hour { display: flex; flex-direction: column; align-items: center; gap: 0.6vh; min-width: 0; }
.hour .h { font-size: clamp(10px, 3.2vh, 14px); color: var(--fg-2); font-weight: 600; font-variant-numeric: tabular-nums; }
.hour svg { width: min(4.6vw, 9.5vh); height: min(4.6vw, 9.5vh); }
.hour .t { font-family: var(--font-num); font-size: clamp(12px, 4vh, 18px); font-weight: 600; font-variant-numeric: tabular-nums; }
.hour .p { font-size: clamp(9px, 2.8vh, 12px); color: var(--rain); font-weight: 600; min-height: 1.2em; }
.foot {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.2em 1em;
  white-space: nowrap;
  font-size: clamp(9px, 2.6vh, 11px);
  color: var(--fg-3);
}
.foot a { color: inherit; text-decoration: none; }
.msg {
  font-size: clamp(11px, 3.4vh, 15px);
  color: var(--fg-2);
  line-height: 1.5;
}
.toast {
  position: fixed; left: 50%; bottom: max(3vh, env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%) translateY(20px);
  background: rgba(44, 44, 46, 0.92);
  color: var(--fg);
  font-size: 13px;
  padding: 8px 14px;
  border-radius: 999px;
  opacity: 0;
  transition: opacity 0.4s ease, transform 0.4s ease;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 縦向きでも崩れないように縦積みにする */
@media (orientation: portrait) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto; align-content: center; gap: 4vh; }
  .time { font-size: 24vw; }
  .date, .day { font-size: 4.4vw; }
  .days { gap: 4vw; }
  .weather { padding: 3vh 5vw; }
  .now .temp { font-size: 16vw; }
  .now .icon svg { width: 18vw; height: 18vw; }
  .hour svg { width: 9vw; height: 9vw; }
}
@media (prefers-reduced-motion: reduce) {
  .sky, .sky-grad, .app, .time .colon { transition: none; }
}
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="sky-grad" id="skyA"></div>
  <div class="sky-grad" id="skyB"></div>
  <canvas id="fx"></canvas>
  <div class="scrim"></div>
</div>
<main class="app" id="app">
  <section class="clock" aria-label="時計">
    <div class="date" id="date">&nbsp;</div>
    <div class="time" id="time" aria-live="off">
      <span id="hh">--</span><span class="colon" id="colon">:</span><span id="mm">--</span><span class="sec" id="ss">--</span>
    </div>
    <div class="days" id="days"></div>
  </section>

  <section class="weather" aria-label="天気">
    <div class="place" id="place">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3 3 10.5l7.5 2.9L13.5 21z"/></svg>
      <span id="placeName">現在地</span>
    </div>
    <div class="now">
      <div class="temp" id="temp">--°</div>
      <div class="icon" id="nowIcon"></div>
    </div>
    <div class="cond">
      <div class="label" id="condLabel">天気を取得しています</div>
      <div class="meta" id="condMeta">&nbsp;</div>
    </div>
    <div class="hours" id="hours"></div>
    <div class="foot">
      <span id="updated">&nbsp;</span>
      <a href="https://open-meteo.com/" target="_blank" rel="noopener">天気データ：Open-Meteo.com</a>
    </div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===== 背景の空（時間帯 × 天気）=====
   時間帯は日の出・日の入りの時刻から決める。天気はWMO天気コードを7種類にまとめる。
   確認用：URL末尾に ?t=17:00&w=3 のように付けると、その時刻と天気コードで背景を表示する。 */
var Sky = (function () {
  "use strict";

  var params = new URLSearchParams(location.search);
  var FORCE_T = params.get("t");                 // "HH:MM"
  var FORCE_W = params.has("w") ? +params.get("w") : null;
  var REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- 色ユーティリティ ----------
  function hex(h) { h = h.replace("#", ""); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function rgba(c, a) { return "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + (a == null ? 1 : a) + ")"; }
  function lum(c) { return 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]; }

  // ---------- 時間帯のキーフレーム（晴天時の空）----------
  // ref: S=日の出, E=日の入り, N=南中（その中間） / m: 基準からの分
  // top/mid/bot: 空の上・中・地平線 / cl,cs: 雲の明るい面・影の面 / glow: 太陽（月）の光 / ga: 光の強さ / st: 星の見え方
  var KEYS = [
    { ref: "S", m: -100, top: "#03050d", mid: "#08102a", bot: "#141c3c", cl: "#3a4565", cs: "#151b2e", glow: "#8fa3ff", ga: 0.10, st: 1 },
    { ref: "S", m: -45,  top: "#0a1230", mid: "#28305e", bot: "#6a4f7c", cl: "#7a6f99", cs: "#2a2b4d", glow: "#ff9e80", ga: 0.25, st: 0.5 },
    { ref: "S", m: 0,    top: "#28488a", mid: "#8a80b0", bot: "#f5a98a", cl: "#ffc6b8", cs: "#7a7aa6", glow: "#ffb48a", ga: 0.65, st: 0 },
    { ref: "S", m: 45,   top: "#3a79d4", mid: "#7fb3ea", bot: "#f6d4ac", cl: "#fff1e2", cs: "#a9b6cf", glow: "#fff0c8", ga: 0.55, st: 0 },
    { ref: "S", m: 150,  top: "#2b7fe2", mid: "#5eaaf2", bot: "#aedcfb", cl: "#ffffff", cs: "#c2d0e2", glow: "#fffbe8", ga: 0.45, st: 0 },
    { ref: "N", m: 0,    top: "#1d6bd6", mid: "#4b97e8", bot: "#8ec6f3", cl: "#ffffff", cs: "#c3cfde", glow: "#ffffff", ga: 0.40, st: 0 },
    { ref: "E", m: -120, top: "#2470d4", mid: "#5a9de4", bot: "#a4cdef", cl: "#ffffff", cs: "#c0cbdc", glow: "#fff6dc", ga: 0.42, st: 0 },
    { ref: "E", m: -55,  top: "#3466b0", mid: "#a5b3c9", bot: "#f6c27c", cl: "#ffe0b0", cs: "#9a93a8", glow: "#ffc874", ga: 0.65, st: 0 },
    { ref: "E", m: 0,    top: "#2a3c78", mid: "#b06878", bot: "#ff8748", cl: "#ffb487", cs: "#7c5f86", glow: "#ff8a4a", ga: 0.85, st: 0 },
    { ref: "E", m: 25,   top: "#1a2354", mid: "#5a3e70", bot: "#d86a52", cl: "#d98a8c", cs: "#45395f", glow: "#ff7a50", ga: 0.45, st: 0.15 },
    { ref: "E", m: 60,   top: "#0b1232", mid: "#232858", bot: "#4a3862", cl: "#5f5880", cs: "#1f2140", glow: "#a08cff", ga: 0.15, st: 0.6 },
    { ref: "E", m: 110,  top: "#03050d", mid: "#08102a", bot: "#141c3c", cl: "#3a4565", cs: "#151b2e", glow: "#8fa3ff", ga: 0.10, st: 1 }
  ].map(function (k) {
    return { ref: k.ref, m: k.m, top: hex(k.top), mid: hex(k.mid), bot: hex(k.bot), cl: hex(k.cl), cs: hex(k.cs), glow: hex(k.glow), ga: k.ga, st: k.st };
  });

  // ---------- 天気の種類 ----------
  // cover: 雲の量 / grey: 空の灰色化 / dark: 暗さ(1=そのまま) / precip: 降水
  var KINDS = {
    clear:   { cover: 0,    grey: 0,    dark: 1,    clouds: 0,  precip: null },
    few:     { cover: 0.15, grey: 0.04, dark: 1,    clouds: 3,  precip: null },
    partly:  { cover: 0.4,  grey: 0.12, dark: 0.98, clouds: 6,  precip: null },
    overcast:{ cover: 0.9,  grey: 0.55, dark: 0.88, clouds: 11, precip: null },
    fog:     { cover: 0.7,  grey: 0.7,  dark: 0.9,  clouds: 3,  precip: "fog" },
    drizzle: { cover: 0.95, grey: 0.62, dark: 0.78, clouds: 11, precip: "rain", amount: 70 },
    rain:    { cover: 1,    grey: 0.66, dark: 0.72, clouds: 12, precip: "rain", amount: 150 },
    heavy:   { cover: 1,    grey: 0.72, dark: 0.6,  clouds: 13, precip: "rain", amount: 280 },
    snow:    { cover: 0.95, grey: 0.7,  dark: 0.9,  clouds: 11, precip: "snow", amount: 140 },
    storm:   { cover: 1,    grey: 0.75, dark: 0.5,  clouds: 13, precip: "rain", amount: 260, bolt: true }
  };
  function kindOf(code) {
    if (code === 0) return "clear";
    if (code === 1) return "few";
    if (code === 2) return "partly";
    if (code === 3) return "overcast";
    if (code === 45 || code === 48) return "fog";
    if (code >= 51 && code <= 57) return "drizzle";
    if (code === 61 || code === 80 || code === 66) return "drizzle";
    if (code === 63 || code === 81 || code === 67) return "rain";
    if (code === 65 || code === 82) return "heavy";
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) return "snow";
    if (code >= 95) return "storm";
    return "partly";
  }

  // ---------- 状態 ----------
  var state = { code: FORCE_W != null ? FORCE_W : 0, sunrise: 6 * 60, sunset: 17 * 60 + 30, pal: null, kind: KINDS.clear };

  function minutesOf(iso) { // "2026-11-09T06:12" → 372
    if (!iso) return null;
    var t = iso.split("T")[1]; if (!t) return null;
    return +t.slice(0, 2) * 60 + +t.slice(3, 5);
  }
  function nowMinutes() {
    if (FORCE_T) { var p = FORCE_T.split(":"); return +p[0] * 60 + (+p[1] || 0); }
    var d = new Date(); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
  }

  // キーフレームを補間して、その時刻の晴天パレットを作る
  function clearPalette(t) {
    var S = state.sunrise, E = state.sunset, N = (S + E) / 2;
    var abs = KEYS.map(function (k) { return { at: (k.ref === "S" ? S : k.ref === "E" ? E : N) + k.m, k: k }; });
    // 日付をまたぐ夜をつなぐ
    var first = abs[0], last = abs[abs.length - 1];
    if (t < first.at) t += 1440;
    abs.push({ at: first.at + 1440, k: first.k });
    for (var i = 0; i < abs.length - 1; i++) {
      var a = abs[i], b = abs[i + 1];
      if (t >= a.at && t <= b.at) {
        var f = (t - a.at) / Math.max(1, b.at - a.at);
        f = f * f * (3 - 2 * f); // なめらかに
        return {
          top: mix(a.k.top, b.k.top, f), mid: mix(a.k.mid, b.k.mid, f), bot: mix(a.k.bot, b.k.bot, f),
          cl: mix(a.k.cl, b.k.cl, f), cs: mix(a.k.cs, b.k.cs, f), glow: mix(a.k.glow, b.k.glow, f),
          ga: a.k.ga + (b.k.ga - a.k.ga) * f, st: a.k.st + (b.k.st - a.k.st) * f
        };
      }
    }
    return clearPalette(last.at - 1);
  }

  // 天気で空を曇らせる（灰色に寄せて、暗くする）
  function weatherPalette(p, kd) {
    // 朝焼け・夕焼けの時間は、曇っていても色を残す（雲が夕日に照らされて見えるように）
    var warm = Math.max(0, Math.min(1, (p.ga - 0.5) / 0.35));
    var grey = kd.grey * (1 - 0.55 * warm);
    function wx(c, extra) {
      var l = lum(c), g = [l * 0.97, l * 0.99, l * 1.04];
      var out = mix(c, g, grey * (extra || 1));
      return [Math.min(255, out[0] * kd.dark), Math.min(255, out[1] * kd.dark), Math.min(255, out[2] * kd.dark)];
    }
    return {
      top: wx(p.top), mid: wx(p.mid, 0.9), bot: wx(p.bot, 0.75),     // 地平線側は夕焼けの色を少し残す
      cl: wx(p.cl, 0.45 - 0.3 * warm), cs: wx(p.cs, 0.8),
      glow: p.glow, ga: p.ga * (1 - kd.cover * (0.75 - 0.35 * warm)), st: p.st * (1 - kd.cover),
      warm: warm,
      kd: kd
    };
  }

  // 太陽（月）の位置：日の出に左下、南中で上、日の入りに右下
  function sunPos(t) {
    var S = state.sunrise, E = state.sunset;
    var f = (t - S) / (E - S);
    if (f < -0.25 || f > 1.25) { // 夜は月を右上に
      return { x: 0.78, y: 0.16 };
    }
    var c = Math.max(-0.08, Math.min(1.08, f));
    return { x: 0.1 + 0.8 * c, y: 0.92 - 0.78 * Math.sin(Math.PI * Math.max(0, Math.min(1, c))) };
  }

  // ---------- 空のグラデーション（2枚を交互にフェード）----------
  var gradA = document.getElementById("skyA"), gradB = document.getElementById("skyB");
  function gradCss(p) {
    return "linear-gradient(180deg," + rgba(p.top) + " 0%," + rgba(p.mid) + " 58%," + rgba(p.bot) + " 100%)";
  }
  // 下の層(A)が常に今の空。天気が変わった時だけ上の層(B)に新しい空を描いてフェードインし、終わったらAへ移す
  var fadeTimer = null;
  function paintGradient(p, fade) {
    var css = gradCss(p);
    if (!fade || REDUCED) { if (!fadeTimer) gradA.style.background = css; else pendingCss = css; return; }
    clearTimeout(fadeTimer);
    gradB.style.transition = "none"; gradB.style.opacity = 0; gradB.style.background = css;
    void gradB.offsetWidth;
    gradB.style.transition = ""; gradB.style.opacity = 1;
    pendingCss = css;
    fadeTimer = setTimeout(function () {
      gradA.style.background = pendingCss;
      gradB.style.transition = "none"; gradB.style.opacity = 0;
      fadeTimer = null;
    }, 3100);
  }
  var pendingCss = "";

  // ---------- キャンバス（雲・雨・雪・星・光）----------
  var cv = document.getElementById("fx"), ctx = cv.getContext("2d");
  var W = 0, H = 0, SCALE = Math.min(window.devicePixelRatio || 1, 1.5);
  function resize() {
    W = Math.round(innerWidth * SCALE); H = Math.round(innerHeight * SCALE);
    cv.width = W; cv.height = H;
    buildScene();
  }

  function rand(a, b) { return a + Math.random() * (b - a); }

  // 雲の画像を1枚作る：やわらかい丸を重ねて形を作り、上を明るく下を影色で塗る
  function cloudSprite(w, h, p, sx, puffs) {
    var c = document.createElement("canvas");
    c.width = Math.max(4, w | 0); c.height = Math.max(4, h | 0);
    var g = c.getContext("2d");
    for (var i = 0; i < puffs; i++) {
      var u = Math.random();
      var cx = w * (0.12 + 0.76 * u);
      var hump = Math.sin(Math.PI * u);                 // 真ん中ほど高く大きい
      var r = h * (0.18 + 0.3 * hump) * rand(0.75, 1.15);
      var cy = h * (0.72 - 0.32 * hump * rand(0.6, 1));
      var rg = g.createRadialGradient(cx, cy, r * 0.15, cx, cy, r);
      rg.addColorStop(0, "rgba(255,255,255,0.95)");
      rg.addColorStop(0.55, "rgba(255,255,255,0.75)");
      rg.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = rg;
      g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
    }
    // 形に色をのせる（上が光の色、下が影の色）
    g.globalCompositeOperation = "source-in";
    var lg = g.createLinearGradient(0, 0, 0, h);
    lg.addColorStop(0, rgba(p.cl));
    lg.addColorStop(0.55, rgba(mix(p.cl, p.cs, 0.45)));
    lg.addColorStop(1, rgba(p.cs));
    g.fillStyle = lg; g.fillRect(0, 0, w, h);
    // 太陽側をほんのり照らす（夕焼け・朝焼けで効く）
    g.globalCompositeOperation = "source-atop";
    var hx = sx < 0.5 ? 0 : w;
    var hg = g.createRadialGradient(hx, h * 0.6, 0, hx, h * 0.6, w * 0.9);
    hg.addColorStop(0, rgba(p.glow, (0.35 + 0.35 * (p.warm || 0)) * Math.min(1, p.ga * 1.6)));
    hg.addColorStop(1, rgba(p.glow, 0));
    g.fillStyle = hg; g.fillRect(0, 0, w, h);
    if (p.warm > 0.05) { // 低い太陽が雲の底を染める
      var bg = g.createLinearGradient(0, h * 0.45, 0, h);
      bg.addColorStop(0, rgba(p.glow, 0));
      bg.addColorStop(1, rgba(p.glow, 0.45 * p.warm));
      g.fillStyle = bg; g.fillRect(0, 0, w, h);
    }
    return c;
  }

  var clouds = [], drops = [], flakes = [], stars = [], fogs = [], flash = 0, nextBolt = 0, sun = { x: 0.5, y: 0.3 };

  function buildScene() {
    if (!state.pal || !W) return;
    var p = state.pal, kd = p.kd;
    sun = sunPos(nowMinutes());

    // 雲：奥・中・手前の3層。曇り・雨は大きな雲で空をおおう
    clouds = [];
    var n = kd.clouds;
    for (var i = 0; i < n; i++) {
      var layer = i % 3;                                  // 0=奥 1=中 2=手前
      var big = kd.cover > 0.6;
      var w = W * (big ? rand(0.55, 1.0) : rand(0.28, 0.5)) * (0.75 + layer * 0.15);
      var h = w * rand(0.32, 0.45);
      var spr = cloudSprite(w, h, p, sun.x, big ? 26 : 18);
      clouds.push({
        img: spr, w: w, h: h,
        x: rand(-w * 0.5, W),
        y: (big ? rand(-0.2, 0.55) : rand(0.02, 0.5)) * H - h * 0.3 + layer * H * 0.04,
        v: (4 + layer * 4) * SCALE * rand(0.8, 1.2),       // 1秒あたりの移動量
        a: big ? rand(0.75, 0.95) : rand(0.8, 1)
      });
    }
    clouds.sort(function (a, b) { return a.v - b.v; });

    // 星
    stars = [];
    if (p.st > 0.02) {
      for (var s = 0; s < 140; s++) stars.push({ x: Math.random() * W, y: Math.random() * H * 0.75, r: rand(0.4, 1.3) * SCALE, ph: Math.random() * 6.28, sp: rand(0.6, 1.8) });
    }

    // 雨・雪
    drops = []; flakes = [];
    var amount = kd.amount ? Math.round(kd.amount * (W * H) / (1104 * 621)) : 0;
    if (kd.precip === "rain") for (var d = 0; d < amount; d++) drops.push(newDrop(true));
    if (kd.precip === "snow") for (var f = 0; f < amount; f++) flakes.push(newFlake(true));

    // 霧
    fogs = [];
    if (kd.precip === "fog") for (var k = 0; k < 6; k++) fogs.push({ y: H * rand(0.25, 0.95), h: H * rand(0.18, 0.35), x: rand(0, W), v: rand(5, 12) * SCALE, a: rand(0.25, 0.45) });

    nextBolt = performance.now() + rand(4000, 9000);
  }
  function newDrop(anyY) {
    var z = Math.random();
    return { x: rand(-W * 0.1, W), y: anyY ? rand(-H, H) : rand(-H * 0.3, -10), l: (10 + z * 18) * SCALE, v: (650 + z * 600) * SCALE, a: 0.18 + z * 0.35, w: (0.7 + z * 0.9) * SCALE };
  }
  function newFlake(anyY) {
    var z = Math.random();
    return { x: Math.random() * W, y: anyY ? Math.random() * H : -10, r: (1 + z * 2.6) * SCALE, v: (25 + z * 55) * SCALE, a: 0.5 + z * 0.45, ph: Math.random() * 6.28, sw: rand(0.4, 1.2) };
  }

  // ---------- 描画ループ（最大30fps）----------
  var last = 0, running = false;
  function frame(now) {
    if (!running) return;
    requestAnimationFrame(frame);
    if (now - last < 33) return;
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    draw(dt, now);
  }

  function draw(dt, now) {
    var p = state.pal; if (!p) return;
    var kd = p.kd;
    ctx.clearRect(0, 0, W, H);

    // 星（雲より奥）
    if (stars.length) {
      ctx.fillStyle = "#ffffff";
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        ctx.globalAlpha = p.st * (0.45 + 0.55 * Math.sin(now / 1000 * s.sp + s.ph) * 0.5 + 0.275);
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // 太陽・月の光
    var gx = sun.x * W, gy = sun.y * H, gr = Math.max(W, H) * 0.55;
    var g = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
    g.addColorStop(0, rgba(p.glow, Math.min(0.85, p.ga)));
    g.addColorStop(0.18, rgba(p.glow, p.ga * 0.45));
    g.addColorStop(1, rgba(p.glow, 0));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // 雲
    for (var c = 0; c < clouds.length; c++) {
      var cl = clouds[c];
      cl.x += cl.v * dt;
      if (cl.x > W) cl.x = -cl.w;
      ctx.globalAlpha = cl.a;
      ctx.drawImage(cl.img, cl.x, cl.y, cl.w, cl.h);
    }
    ctx.globalAlpha = 1;

    // 霧
    for (var f = 0; f < fogs.length; f++) {
      var fg = fogs[f];
      fg.x += fg.v * dt; if (fg.x > W) fg.x -= W * 2;
      var lg = ctx.createLinearGradient(0, fg.y - fg.h / 2, 0, fg.y + fg.h / 2);
      lg.addColorStop(0, rgba(p.cl, 0)); lg.addColorStop(0.5, rgba(p.cl, fg.a)); lg.addColorStop(1, rgba(p.cl, 0));
      ctx.fillStyle = lg;
      ctx.fillRect(fg.x - W, fg.y - fg.h / 2, W * 2, fg.h);
    }

    // 雨
    if (drops.length) {
      ctx.strokeStyle = "rgb(205,222,245)"; ctx.lineCap = "round";
      for (var d = 0; d < drops.length; d++) {
        var r = drops[d];
        r.y += r.v * dt; r.x += r.v * dt * 0.12;
        if (r.y > H + r.l) { drops[d] = newDrop(false); continue; }
        ctx.globalAlpha = r.a; ctx.lineWidth = r.w;
        ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - r.l * 0.12, r.y - r.l); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    // 雪
    if (flakes.length) {
      ctx.fillStyle = "#ffffff";
      for (var k = 0; k < flakes.length; k++) {
        var fl = flakes[k];
        fl.y += fl.v * dt; fl.x += Math.sin(now / 1000 * fl.sw + fl.ph) * 12 * SCALE * dt;
        if (fl.y > H + 5) { flakes[k] = newFlake(false); continue; }
        ctx.globalAlpha = fl.a;
        ctx.beginPath(); ctx.arc(fl.x, fl.y, fl.r, 0, 6.283); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // 雷
    if (kd.bolt && !REDUCED) {
      if (now > nextBolt) { flash = 1; nextBolt = now + rand(5000, 14000); if (Math.random() < 0.5) setTimeout(function () { flash = 0.8; }, 180); }
      if (flash > 0.01) {
        ctx.fillStyle = "rgba(220,230,255," + (flash * 0.55) + ")"; ctx.fillRect(0, 0, W, H);
        flash *= 0.82;
      }
    }
  }

  // ---------- 更新 ----------
  var lastKey = "";
  function update(force) {
    var t = nowMinutes();
    var kd = KINDS[kindOf(state.code)];
    var pal = weatherPalette(clearPalette(t), kd);
    var key = kindOf(state.code);
    var kindChanged = key !== lastKey;
    state.pal = pal; state.kind = kd;
    paintGradient(pal, kindChanged && lastKey !== "");
    // 文字の下に敷く影の濃さ：空が明るいほど濃く
    var bright = lum(pal.mid) / 255;
    document.documentElement.style.setProperty("--scrim", (0.05 + bright * 0.22).toFixed(3));
    if (force || kindChanged) buildScene();
    else {
      // 時間の変化で雲の色・太陽の位置を少しずつ合わせる（5分ごとに作り直す）
      var p = sunPos(t); sun = p;
    }
    lastKey = key;
    if (REDUCED) draw(0, performance.now());
  }

  function setWeather(code, sunriseIso, sunsetIso) {
    if (FORCE_W == null) state.code = code;
    var sr = minutesOf(sunriseIso), ss = minutesOf(sunsetIso);
    if (sr != null && ss != null && ss > sr) { state.sunrise = sr; state.sunset = ss; }
    update(true);
  }

  function start() {
    W = 0;
    update(false);
    resize();
    if (!REDUCED) { running = true; requestAnimationFrame(frame); }
    else draw(0, performance.now());
    setInterval(function () { update(false); }, 60 * 1000);       // 空の色は1分ごと
    setInterval(function () { buildScene(); }, 5 * 60 * 1000);     // 雲の色は5分ごと
    var rt; addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(resize, 200); });
    document.addEventListener("visibilitychange", function () {
      running = document.visibilityState === "visible" && !REDUCED;
      if (running) { last = performance.now(); requestAnimationFrame(frame); }
    });
  }

  return { start: start, setWeather: setWeather };
})();
Sky.start();
</script>

<script>
(function () {
  "use strict";

  // ===== 設定 =====
  var REFRESH_MS = 15 * 60 * 1000;          // 天気の更新間隔（15分）
  var NIGHT_FROM = 23, NIGHT_TO = 6;        // この時間帯は画面を暗めにする
  var FALLBACK = { lat: 35.6812, lon: 139.7671, name: "東京（位置情報なし）" };
  var WD = ["日", "月", "火", "水", "木", "金", "土"];

  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  var pad = function (n) { return (n < 10 ? "0" : "") + n; };

  // ===== 時計 =====
  function tick() {
    var d = new Date();
    $("hh").textContent = pad(d.getHours());
    $("mm").textContent = pad(d.getMinutes());
    $("ss").textContent = pad(d.getSeconds());
    $("colon").classList.toggle("dim", d.getSeconds() % 2 === 1);
    var wd = d.getDay();
    var cls = wd === 0 ? "wd" : wd === 6 ? "wd sat" : "wd week";
    $("date").innerHTML = (d.getMonth() + 1) + "月" + d.getDate() + "日<span class=\"" + cls + "\">" + WD[wd] + "曜日</span>";
    var h = d.getHours();
    document.body.classList.toggle("night", h >= NIGHT_FROM || h < NIGHT_TO);
    setTimeout(tick, 1000 - d.getMilliseconds() + 5);
  }

  // ===== 天気アイコン（WMO天気コード → SVG） =====
  var CLOUD = "M19 47h27a11 11 0 0 0 1-22 15 15 0 0 0-28.6-3.2A12.6 12.6 0 0 0 19 47z";
  function sun(cx, cy, r) {
    var rays = "";
    for (var i = 0; i < 8; i++) {
      var a = i * Math.PI / 4, x1 = cx + Math.cos(a) * (r + 5), y1 = cy + Math.sin(a) * (r + 5),
          x2 = cx + Math.cos(a) * (r + 10), y2 = cy + Math.sin(a) * (r + 10);
      rays += "<line x1='" + x1.toFixed(1) + "' y1='" + y1.toFixed(1) + "' x2='" + x2.toFixed(1) + "' y2='" + y2.toFixed(1) + "'/>";
    }
    return "<g stroke='var(--sun)' stroke-width='3.4' stroke-linecap='round'>" + rays + "</g><circle cx='" + cx + "' cy='" + cy + "' r='" + r + "' fill='var(--sun)'/>";
  }
  function moon(cx, cy, r) {
    // 左に膨らむ三日月：外側は半円、内側は細い楕円弧
    return "<path fill='#f2f2f7' d='M" + cx + " " + (cy - r) + "A" + r + " " + r + " 0 0 0 " + cx + " " + (cy + r) +
      "A" + (r * 0.55) + " " + r + " 0 0 1 " + cx + " " + (cy - r) + "z' transform='translate(" + (r * 0.4) + " 0)'/>";
  }
  function cloud(dy, fill) {
    return "<path transform='translate(0 " + dy + ")' fill='" + (fill || "var(--cloud)") + "' d='" + CLOUD + "'/>";
  }
  function drops(color, n) {
    var s = "<g stroke='" + color + "' stroke-width='3.6' stroke-linecap='round'>";
    var xs = n === 2 ? [26, 38] : [21, 32, 43];
    xs.forEach(function (x) { s += "<line x1='" + x + "' y1='46' x2='" + (x - 3) + "' y2='56'/>"; });
    return s + "</g>";
  }
  function flakes() {
    var s = "<g fill='var(--snow)'>";
    [[22, 50], [32, 56], [42, 50], [27, 59], [37, 61]].forEach(function (p) { s += "<circle cx='" + p[0] + "' cy='" + p[1] + "' r='2.6'/>"; });
    return s + "</g>";
  }
  function svg(inner) { return "<svg viewBox='0 0 64 64' aria-hidden='true'>" + inner + "</svg>"; }

  function weatherInfo(code, isDay) {
    var day = isDay !== 0;
    var orb = day ? sun(22, 22, 9) : moon(22, 22, 10);
    var dimCloud = "#aeb6c4";
    switch (code) {
      case 0: return { label: day ? "快晴" : "晴れ", icon: svg(day ? sun(32, 32, 12) : moon(32, 32, 15)), tone: day ? "clear" : "night" };
      case 1: return { label: "晴れ", icon: svg(orb + "<path transform='translate(6 6) scale(.8)' fill='var(--cloud)' d='" + CLOUD + "'/>"), tone: day ? "clear" : "night" };
      case 2: return { label: "晴れ時々くもり", icon: svg(orb + cloud(4)), tone: day ? "cloud" : "night" };
      case 3: return { label: "くもり", icon: svg(cloud(-2, dimCloud) ), tone: "cloud" };
      case 45: case 48: return { label: "霧", icon: svg("<g stroke='var(--cloud)' stroke-width='3.6' stroke-linecap='round'><line x1='12' y1='24' x2='52' y2='24'/><line x1='8' y1='33' x2='48' y2='33'/><line x1='16' y1='42' x2='56' y2='42'/><line x1='12' y1='51' x2='44' y2='51'/></g>"), tone: "cloud" };
      case 51: case 53: case 55: return { label: "霧雨", icon: svg(cloud(-8, dimCloud) + drops("var(--rain)", 2)), tone: "rain" };
      case 56: case 57: return { label: "着氷性の霧雨", icon: svg(cloud(-8, dimCloud) + drops("var(--snow)", 2)), tone: "rain" };
      case 61: return { label: "小雨", icon: svg(cloud(-8, dimCloud) + drops("var(--rain)", 2)), tone: "rain" };
      case 63: return { label: "雨", icon: svg(cloud(-8, dimCloud) + drops("var(--rain)", 3)), tone: "rain" };
      case 65: return { label: "強い雨", icon: svg(cloud(-8, "#8e96a4") + drops("var(--rain)", 3)), tone: "rain" };
      case 66: case 67: return { label: "着氷性の雨", icon: svg(cloud(-8, dimCloud) + drops("var(--snow)", 3)), tone: "rain" };
      case 71: return { label: "小雪", icon: svg(cloud(-8) + flakes()), tone: "snow" };
      case 73: return { label: "雪", icon: svg(cloud(-8) + flakes()), tone: "snow" };
      case 75: return { label: "大雪", icon: svg(cloud(-8) + flakes()), tone: "snow" };
      case 77: return { label: "霧雪", icon: svg(cloud(-8) + flakes()), tone: "snow" };
      case 80: case 81: return { label: "にわか雨", icon: svg(orb + cloud(-4) + drops("var(--rain)", 2)), tone: "rain" };
      case 82: return { label: "激しいにわか雨", icon: svg(cloud(-8, "#8e96a4") + drops("var(--rain)", 3)), tone: "rain" };
      case 85: case 86: return { label: "にわか雪", icon: svg(orb + cloud(-4) + flakes()), tone: "snow" };
      case 95: return { label: "雷雨", icon: svg(cloud(-8, "#8e96a4") + "<path fill='var(--bolt)' d='M34 40 24 54h8l-3 9 12-15h-8l3-8z'/>"), tone: "storm" };
      case 96: case 99: return { label: "雷雨（ひょう）", icon: svg(cloud(-8, "#8e96a4") + "<path fill='var(--bolt)' d='M34 40 24 54h8l-3 9 12-15h-8l3-8z'/>"), tone: "storm" };
      default: return { label: "—", icon: svg(cloud(0)), tone: "cloud" };
    }
  }

  // ===== 位置情報 =====
  function getPosition() {
    return new Promise(function (resolve) {
      var cached = store.get("sora.pos");
      if (!("geolocation" in navigator)) { resolve(cached || FALLBACK); return; }
      navigator.geolocation.getCurrentPosition(function (p) {
        var pos = { lat: +p.coords.latitude.toFixed(3), lon: +p.coords.longitude.toFixed(3), name: "現在地" };
        store.set("sora.pos", pos);
        resolve(pos);
      }, function () {
        resolve(cached || FALLBACK);
      }, { enableHighAccuracy: false, timeout: 15000, maximumAge: 30 * 60 * 1000 });
    });
  }

  // ===== 天気の取得 =====
  function apiUrl(pos) {
    return "https://api.open-meteo.com/v1/forecast?latitude=" + pos.lat + "&longitude=" + pos.lon +
      "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,is_day" +
      "&hourly=temperature_2m,weather_code,precipitation_probability,is_day" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset" +
      "&timezone=auto&forecast_days=4";
  }

  var lastFetch = 0, loading = false;
  function refresh(force) {
    if (loading) return;
    if (!force && Date.now() - lastFetch < 60 * 1000) return;
    loading = true;
    getPosition().then(function (pos) {
      return fetch(apiUrl(pos), { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      }).then(function (data) {
        data._place = pos.name;
        data._fetched = Date.now();
        store.set("sora.weather", data);
        lastFetch = Date.now();
        render(data, false);
      });
    }).catch(function () {
      var cached = store.get("sora.weather");
      if (cached) render(cached, true);
      else {
        $("condLabel").textContent = "天気を取得できません";
        $("condMeta").textContent = "通信を確認してください。画面をタップすると再試行します";
      }
    }).then(function () { loading = false; });
  }

  function render(d, stale) {
    var c = d.current;
    var info = weatherInfo(c.weather_code, c.is_day);
    var round = function (v) { return v == null ? "--" : Math.round(v); };

    $("placeName").textContent = d._place || "現在地";
    $("temp").textContent = round(c.temperature_2m) + "°";
    $("nowIcon").innerHTML = info.icon;
    $("condLabel").textContent = info.label;
    var dl = d.daily;
    $("condMeta").innerHTML = "<span>最高 " + round(dl.temperature_2m_max[0]) + "° / 最低 " + round(dl.temperature_2m_min[0]) +
      "°</span><span>体感 " + round(c.apparent_temperature) + "°・湿度 " + round(c.relative_humidity_2m) + "%</span>";
    Sky.setWeather(c.weather_code, dl.sunrise ? dl.sunrise[0] : null, dl.sunset ? dl.sunset[0] : null);

    // 時間ごとの予報（次の時刻から5つ）
    var h = d.hourly, nowKey = c.time.slice(0, 13), start = 0;
    for (var i = 0; i < h.time.length; i++) { if (h.time[i].slice(0, 13) === nowKey) { start = i + 1; break; } }
    var html = "";
    for (var j = start; j < Math.min(start + 5, h.time.length); j++) {
      var hi = weatherInfo(h.weather_code[j], h.is_day[j]);
      var pp = h.precipitation_probability ? h.precipitation_probability[j] : null;
      html += "<div class='hour'><div class='h'>" + parseInt(h.time[j].slice(11, 13), 10) + "時</div>" + hi.icon +
        "<div class='t'>" + round(h.temperature_2m[j]) + "°</div><div class='p'>" + (pp != null && pp >= 20 ? pp + "%" : "") + "</div></div>";
    }
    $("hours").innerHTML = html;

    // 明日から3日間
    var dhtml = "";
    for (var k = 1; k <= 3 && k < dl.time.length; k++) {
      var p = dl.time[k].split("-"), dd = new Date(+p[0], +p[1] - 1, +p[2]);
      var di = weatherInfo(dl.weather_code[k], 1);
      dhtml += "<div class='day'><span class='name'>" + (k === 1 ? "明日" : WD[dd.getDay()]) + "</span>" + di.icon +
        "<span class='hi'>" + round(dl.temperature_2m_max[k]) + "°</span><span class='lo'>" + round(dl.temperature_2m_min[k]) + "°</span></div>";
    }
    $("days").innerHTML = dhtml;

    var t = new Date(d._fetched || Date.now());
    $("updated").textContent = (stale ? "オフライン・" : "") + t.getHours() + ":" + pad(t.getMinutes()) + " 更新";
  }

  // ===== 画面を消さない（対応環境のみ） =====
  var wakeLock = null;
  function requestWake() {
    if (!("wakeLock" in navigator) || wakeLock) return;
    navigator.wakeLock.request("screen").then(function (lock) {
      wakeLock = lock;
      lock.addEventListener("release", function () { wakeLock = null; });
    }).catch(function () { /* 非対応・拒否は無視（自動ロック「なし」で運用） */ });
  }

  // ===== トースト =====
  var toastTimer;
  function toast(text) {
    var el = $("toast");
    el.textContent = text;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2200);
  }

  // ===== 起動 =====
  tick();
  var cached = store.get("sora.weather");
  if (cached) render(cached, true);
  refresh(true);
  requestWake();
  setInterval(function () { refresh(true); }, REFRESH_MS);

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") {
      requestWake();
      if (Date.now() - lastFetch > 10 * 60 * 1000) refresh(true);
    }
  });
  document.addEventListener("click", function () {
    requestWake();
    toast("天気を更新しています");
    refresh(false);
  });
})();
</script>
</body>
</html>
